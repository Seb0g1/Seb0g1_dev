################################################################
# Seb0g1.dev — sebog1.ru
# Разместить: /etc/nginx/sites-available/sebog1.ru
# Активировать: ln -s ../sites-available/sebog1.ru /etc/nginx/sites-enabled/
#
# ВАЖНО:
# - Этот файл не конфликтует с другими сайтами на сервере: nginx
#   роутит по `server_name`, поэтому соседние домены продолжат работать.
# - Бэкенд слушает 127.0.0.1:4010 (см. systemd unit), снаружи закрыт.
# - SSL добавит certbot (см. инструкцию).
################################################################

# 1) Редирект www -> apex (опционально)
server {
    listen 80;
    listen [::]:80;
    server_name www.sebog1.ru;
    return 301 http://sebog1.ru$request_uri;
}

# 2) Основной сайт
server {
    listen 80;
    listen [::]:80;
    server_name sebog1.ru;

    # Куда положили dist (см. инструкцию по деплою)
    root /var/www/sebog1.ru/current/dist;
    index index.html;

    # Базовая безопасность
    server_tokens off;
    client_max_body_size 16m;

    # Лимит на заголовки и таймауты — стандартные
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # === API === проксируем на Node.js на 127.0.0.1:4010
    location /api/ {
        proxy_pass http://127.0.0.1:4010;
    }

    # === Загруженные файлы (фото проектов) ===
    # Можно отдавать через Node, но через nginx быстрее.
    # Если используете персистентный путь /var/www/sebog1.ru/storage/uploads/
    # — раскомментируйте alias и закомментируйте proxy_pass.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4010;
        # alias /var/www/sebog1.ru/storage/uploads/;
        # access_log off;
        # expires 7d;
    }

    # === Кэш статики (хеши в именах — кэшируем надолго) ===
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # === SPA fallback === любой URL отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/rss+xml image/svg+xml;
}
